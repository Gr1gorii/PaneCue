name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests and app packaging
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build private-corpus benchmark runner
        run: swift build --product PaneCueDialogueBenchmark

      - name: Package stable app
        run: ./scripts/package_app.sh

      - name: Verify stable binary separation
        run: ./scripts/verify_stable_binary_separation.sh build/PaneCue.app

      - name: Package experimental app
        run: ./scripts/package_app.sh --experimental

      - name: Verify app signatures
        run: |
          codesign --verify --deep --strict build/PaneCue.app
          codesign --verify --deep --strict "build/PaneCue Experimental.app"
